name: UTEHY Watch

on:
  schedule:
    - cron: "7 */2 * * *"  # kiểm tra thay đổi mỗi 2 tiếng (giờ UTC; GitHub có thể chạy trễ vài phút)
    - cron: "0 13 * * *"   # nhắc lịch học ngày mai lúc 20:00 giờ Việt Nam (13:00 UTC)
  workflow_dispatch:  # nút "Run workflow" để chạy thử bằng tay
    inputs:
      mode:
        description: "check = kiểm tra thay đổi, remind = nhắc lịch học ngày mai"
        type: choice
        options: [check, remind]
        default: check

concurrency:
  group: utehy-watch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REMIND: ${{ github.event.schedule == '0 13 * * *' || inputs.mode == 'remind' }}
      UTEHY_USER: ${{ secrets.UTEHY_USER }}
      UTEHY_PASS: ${{ secrets.UTEHY_PASS }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Nhắc lịch học ngày mai
        if: env.REMIND == 'true'
        run: python watch.py --remind

      # state.json (lần đọc trước) được giữ trong cache của GitHub, không đưa vào code.
      - uses: actions/cache/restore@v4
        if: env.REMIND != 'true'
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Kiểm tra cổng trường
        if: env.REMIND != 'true'
        continue-on-error: true  # mất mạng hay trang trường lỗi thì lần sau thử lại, không gửi email báo lỗi
        run: python watch.py

      - uses: actions/cache/save@v4
        if: env.REMIND != 'true' && hashFiles('state.json') != ''
        with:
          path: state.json
          key: state-${{ github.run_id }}
